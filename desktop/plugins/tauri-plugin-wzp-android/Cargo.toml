[package]
name = "tauri-plugin-wzp-android"
version = "0.1.0"
description = "Android bridge for WarzonePhone: SAF file picker, share target, MediaStore Downloads, transfer foreground service"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
# Required by tauri-plugin's build script; also makes tauri-build pick up the
# Gradle library in android/ (DEP_TAURI_PLUGIN_WZP_ANDROID_ANDROID_LIBRARY_PATH).
links = "tauri-plugin-wzp-android"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
